[tool.poetry]
name = "rg-casino"
version = "0.1.0"
description = "Telegram mini app casino with TON payments and NFT gifts"
authors = ["RG Casino Team <dev@example.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
aiogram = "^3.4.1"
fastapi = "^0.110.0"
jinja2 = "^3.1.3"
uvicorn = { extras = ["standard"], version = "^0.27.1" }
httpx = "^0.26.0"
python-dotenv = "^1.0.1"
pydantic = {extras=["dotenv"], version="^2.6.2"}

[tool.poetry.group.dev.dependencies]
ruff = "^0.2.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
